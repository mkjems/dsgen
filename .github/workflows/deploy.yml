name: Deploy Design System Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mkjems/dsgen
  VPS_APP_DIR: /opt/dsgen
  VPS_LOCAL_URL: http://127.0.0.1:8085/
  PUBLIC_URL: https://dsgen.mkjems.dk/

concurrency:
  group: dsgen-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Typecheck, template self-checks and a production build; a failure stops the deploy.
      - name: Checks
        run: |
          npm ci
          npm run check
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd ${{ env.VPS_APP_DIR }}
            # Log in with this run's token; a stale ghcr.io login left on the VPS makes pulls fail with "denied".
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            curl -fsSI --retry 10 --retry-delay 1 --retry-all-errors ${{ env.VPS_LOCAL_URL }}
            curl -fsSI --retry 5 --retry-delay 1 --retry-all-errors ${{ env.PUBLIC_URL }}
